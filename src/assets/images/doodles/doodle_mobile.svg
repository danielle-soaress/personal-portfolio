<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 70" fill="none">
  <!-- Hand-drawn smartphone frame -->
  <rect
    x="12"
    y="6"
    width="32"
    height="56"
    rx="7"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Speaker notch -->
  <line x1="24" y1="11" x2="32" y2="11" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
  <!-- Screen interface doodle lines -->
  <line x1="18" y1="20" x2="38" y2="20" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
  <line x1="18" y1="27" x2="32" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <!-- Mini heartbeat/sensor graph on screen -->
  <path
    d="M 18 38 L 22 38 L 24 33 L 27 43 L 30 36 L 33 38 L 38 38"
    stroke="#ffffff"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Home indicator dot -->
  <circle cx="28" cy="55" r="1.8" fill="#ffffff" />
  <!-- IoT sensor wireless waves -->
  <path d="M 49 20 C 53 24, 53 32, 49 36" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" />
  <path d="M 55 14 C 61 21, 61 39, 55 46" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" />
</svg>
